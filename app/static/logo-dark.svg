<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="大V订阅 DaV Subscription">
  <!-- 深色模式版：低饱和暗蓝紫渐变，融入深色 UI 而非刺眼 -->
  <defs>
    <linearGradient id="dav-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24508f"/>
      <stop offset="0.55" stop-color="#1b3d74"/>
      <stop offset="1" stop-color="#47307e"/>
    </linearGradient>
    <linearGradient id="dav-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#dav-bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#dav-gloss)"/>
  <path d="M150 172 L256 348 L362 172" fill="none" stroke="#ffffff" stroke-width="62"
