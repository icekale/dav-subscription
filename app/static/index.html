<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d5cff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="大V订阅">
  <title>大V订阅</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="apple-touch-startup-image" href="/splash-ios.png">
  <link rel="icon" type="image/svg+xml" href="/logo-mark.svg">
  <script>
    // 主题防闪：首帧前按 localStorage 或系统偏好设置 html.theme-dark（app.js 里 setTheme 管理同一逻辑）
    (function () {
      try {
        var m = localStorage.getItem("theme") || "auto";
        var dark = m === "dark" || (m === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("theme-dark");
      } catch (e) { /* localStorage 不可用时静默 */ }
    })();
  </script>
  <link rel="stylesheet" href="/vendor/design-tokens.css?v=13">
  <link rel="stylesheet" href="/style.css?v=71">
</head>
<body>
  <!-- 登录 / 注册 -->
  <div id="auth-view" class="auth-view hidden">
    <main class="login-shell">
      <div class="login-brand">
        <img id="login-logo" class="login-logo" src="/logo-mark.svg" alt="大V订阅">
        <p class="login-eyebrow">DaV Subscription</p>
        <h1 class="login-brand-title">大V订阅</h1>
        <ul class="login-features">
          <li class="login-feature">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>
            <span>聚合雪球 / 微博 / X 大V动态</span>
          </li>
          <li class="login-feature">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
            <span>实时推送到 Telegram / 飞书 / 企业微信</span>
          </li>
          <li class="login-feature">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            <span>自托管部署，订阅数据完全私有</span>
          </li>
        </ul>
      </div>
      <section class="login-card">
        <div class="login-card-body">
          <div class="auth-switch" role="tablist">
            <button type="button" class="switch-btn active" data-mode="login" role="tab">登录</button>
            <button type="button" class="switch-btn" data-mode="register" role="tab">注册</button>
          </div>
          <form id="login-form" class="login-form">
            <h2 class="login-title">欢迎回来</h2>
            <p class="login-subtitle">回到你的订阅流，继续接收大V动态。</p>
            <label class="field-label" for="login-username">用户名</label>
            <input id="login-username" class="form-control" placeholder="输入用户名" autocomplete="username" required>
            <label class="field-label" for="login-password">密码</label>
            <div class="pw-field">
              <input id="login-password" class="form-control" type="password" placeholder="输入密码" autocomplete="current-password" required>
              <button type="button" class="pw-toggle" aria-label="显示密码" onclick="togglePassword('login-password', this)">
                <svg class="pw-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="pw-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="m1 1 22 22"/></svg>
              </button>
            </div>
            <p id="auth-error" class="form-error" role="alert"></p>
            <button type="submit" class="btn-normal btn-fluid">登 录</button>
          </form>
          <form id="register-form" class="login-form hidden">
            <h2 class="login-title">创建账号</h2>
            <p class="login-subtitle">注册后即可自选大V，开启订阅推送。</p>
            <label class="field-label" for="reg-username">用户名</label>
            <input id="reg-username" class="form-control" placeholder="至少 2 位字符" autocomplete="username" required>
            <label class="field-label" for="reg-password">密码</label>
            <div class="pw-field">
              <input id="reg-password" class="form-control" type="password" placeholder="至少 6 位字符" autocomplete="new-password" required>
              <button type="button" class="pw-toggle" aria-label="显示密码" onclick="togglePassword('reg-password', this)">
                <svg class="pw-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="pw-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="m1 1 22 22"/></svg>
              </button>
            </div>
            <label class="field-label" for="reg-code">邀请码</label>
            <input id="reg-code" class="form-control" placeholder="向管理员索取注册邀请码" required>
            <p id="reg-error" class="form-error" role="alert"></p>
            <button type="submit" class="btn-normal btn-fluid">创建账号</button>
          </form>
        </div>
      </section>
    </main>
  </div>

  <!-- 主应用 -->
  <div id="app-view" class="app-view hidden">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img class="sidebar-logo" id="sidebar-logo" src="/logo-mark.svg" alt="大V订阅">
        <div class="sidebar-brand-text">
          <span class="sidebar-brand-name">大V订阅</span>
          <span class="sidebar-brand-meta">DaV Subscription</span>
        </div>
      </div>
      <nav id="sidebar-nav" class="sidebar-nav"></nav>
      <div class="sidebar-foot">
        <div id="sidebar-user" class="sidebar-user"></div>
      </div>
    </aside>
    <div class="main-col">
      <header class="topbar">
        <div class="topbar-title">
          <button id="btn-back" class="icon-btn hidden">‹</button>
          <img class="topbar-logo" src="/logo-mark.svg" alt="大V订阅">
          <h2 id="page-title">订阅广场</h2>
        </div>
        <div id="topbar-user" class="topbar-user"></div>
      </header>
      <main id="main" class="page-main"></main>
    </div>
    <nav id="bottom-nav" class="bottom-nav"></nav>
  </div>
  <script src="/app.js?v=95"></script>
</body>
</html>
