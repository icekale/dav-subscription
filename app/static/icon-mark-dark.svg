<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="V Push">
  <!-- PWA dark: full-bleed low-chroma navy/violet; same mark as light -->
  <defs>
    <linearGradient id="pwa-bg-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c3a66"/>
      <stop offset="0.55" stop-color="#162e52"/>
      <stop offset="1" stop-color="#33255e"/>
    </linearGradient>
    <linearGradient id="pwa-gloss-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#pwa-bg-dark)"/>
  <rect width="512" height="512" fill="url(#pwa-gloss-dark)"/>
  <path d="M168 188 L256 334 L344 188" fill="none" stroke="#ffffff" stroke-width="52"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="372" cy="142" r="28" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="7"/>
  <circle cx="372" cy="142" r="17" fill="#ffffff"/>
</svg>
