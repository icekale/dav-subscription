<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>大V订阅</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="auth-view" class="auth-view hidden">
    <div class="auth-card">
      <div class="auth-logo"><span>V</span></div>
      <h1>大V订阅</h1>
      <p class="auth-desc">盯大V公开动态 · 新帖推送</p>
      <form id="login-form" class="auth-form">
        <input id="login-username" placeholder="用户名" autocomplete="username" required>
        <input id="login-password" type="password" placeholder="密码" autocomplete="current-password" required>
        <button type="submit" class="btn-dark">登 录</button>
      </form>
      <form id="register-form" class="auth-form hidden">
        <input id="reg-username" placeholder="用户名（至少2位）" autocomplete="username" required>
        <input id="reg-password" type="password" placeholder="密码（至少6位）" autocomplete="new-password" required>
        <button type="submit" class="btn-dark">注 册</button>
      </form>
      <button id="toggle-auth" class="link-btn">还没有账号？去注册</button>
      <p id="auth-error" class="auth-error"></p>
    </div>
  </div>

  <div id="app-view" class="app-view hidden">
    <header id="top-bar" class="top-bar">
      <button id="btn-back" class="icon-btn hidden">‹</button>
      <h2 id="page-title">首页</h2>
      <span id="top-right" class="top-right"></span>
    </header>
    <main id="main" class="main"></main>
    <nav id="tab-bar" class="tab-bar">
      <button class="tab-item active" data-tab="home"><span class="tab-icon">◎</span>首页</button>
      <button class="tab-item" data-tab="timeline"><span class="tab-icon">▤</span>动态</button>
      <button class="tab-item" data-tab="me"><span class="tab-icon">◉</span>我的</button>
    </nav>
  </div>
  <script src="/app.js"></script>
</body>
</html>
