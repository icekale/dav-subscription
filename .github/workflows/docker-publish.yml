name: Publish Docker image

on:
  push:
    branches: ["main"]
    tags: ["v*"]

env:
  IMAGE_NAME: vpush

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: 安装依赖并跑后端测试
        run: |
          pip install -r requirements.txt pytest
          python -m pytest -q
      - name: 前端 JS 语法检查
        run: |
          node --check app/static/app.js
          node --check miniprogram/utils/api.js
          node --check miniprogram/pages/*/*.js

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: 设置 QEMU（arm64 交叉构建）
        uses: docker/setup-qemu-action@v3
      - name: 设置 Buildx（多架构构建）
        uses: docker/setup-buildx-action@v3
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest

  publish-dockerhub:
    # 配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN 仓库密钥后自动启用
    needs: test
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: 设置 QEMU（arm64 交叉构建）
        uses: docker/setup-qemu-action@v3
      - name: 设置 Buildx（多架构构建）
        uses: docker/setup-buildx-action@v3
      - name: 登录 Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 构建并推送 Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/vpush:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/vpush:latest
