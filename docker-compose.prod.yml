services:
  dav-subscription:
    build: .
    container_name: dav-subscription
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - CONFIG_PATH=/app/config.yaml
      - DB_PATH=/data/dav.db
      - FEISHU_APP_ID=${FEISHU_APP_ID}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET}
      - FEISHU_BOT_NAME=${FEISHU_BOT_NAME}
      - FEISHU_WEBHOOK_URL=${FEISHU_WEBHOOK_URL}
      - FEISHU_CREDENTIAL_KEY=${FEISHU_CREDENTIAL_KEY}
      - WECOM_WEBHOOK_URL=${WECOM_WEBHOOK_URL}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME}
      - WECHAT_APP_ID=${WECHAT_APP_ID}
      - WECHAT_APP_SECRET=${WECHAT_APP_SECRET}
      - XUEQIU_COOKIE=${XUEQIU_COOKIE}
      - WEIBO_COOKIE=${WEIBO_COOKIE}
      - WEIBO_TOKEN=${WEIBO_TOKEN}
      - WEIBO_USERNAME=${WEIBO_USERNAME}
      - WEIBO_PASSWORD=${WEIBO_PASSWORD}
      # X 备用通道：指向同 compose 内的自建 RSSHub（不对外暴露）
      - RSSHUB_BASE=${RSSHUB_BASE:-http://rsshub:1200}
      - XAI_API_KEY=${XAI_API_KEY}
      - XAI_MODEL=${XAI_MODEL:-grok-2-latest}
      # X 登录 Cookie（完整串）：主通道直抓 X 官方接口 + 官方翻译，免 API key
      - TWITTER_COOKIE=${TWITTER_COOKIE}
      - WEB_ALLOW_REGISTER=${WEB_ALLOW_REGISTER:-true}
      - WEB_ADMIN_PASSWORD=${WEB_ADMIN_PASSWORD}
      - WEB_TOKEN_SECRET=${WEB_TOKEN_SECRET}
      - POLLING_POSTS_RETENTION_DAYS=${POLLING_POSTS_RETENTION_DAYS:-30}
      - POLLING_PUSH_LOGS_RETENTION_DAYS=${POLLING_PUSH_LOGS_RETENTION_DAYS:-90}
      - POLLING_DIGEST_INTERVAL_SECONDS=${POLLING_DIGEST_INTERVAL_SECONDS:-600}
      - POLLING_SOURCE_PROBE_INTERVAL_SECONDS=${POLLING_SOURCE_PROBE_INTERVAL_SECONDS:-600}
      - POLLING_COOKIE_KEEPALIVE_INTERVAL_SECONDS=${POLLING_COOKIE_KEEPALIVE_INTERVAL_SECONDS:-21600}
      - POLLING_DAILY_REPORT_HOUR=${POLLING_DAILY_REPORT_HOUR:-20}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FILE=${LOG_FILE:-/data/logs/app.log}
    volumes:
      - ./data:/data
    expose:
      - "8000"
    networks: [dav]

  caddy:
    image: caddy:2-alpine
    container_name: dav-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - dav-subscription
    networks: [dav]

  # X 直抓失败时的备用通道
  rsshub:
    image: diygod/rsshub:latest
    container_name: dav-rsshub
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # X 用户时间线路由稳定抓取需要登录 cookie，与主服务共用同一个
      - TWITTER_COOKIE=${TWITTER_COOKIE}
      # 新版 RSSHub 的 X 路由要求 auth_token（登录态 cookie 中的 auth_token= 值）
      - TWITTER_AUTH_TOKEN=${TWITTER_AUTH_TOKEN}
    networks: [dav]

volumes:
  caddy_data:
  caddy_config:

networks:
  dav:
