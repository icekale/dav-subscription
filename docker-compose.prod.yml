services:
  vpush:
    build: .
    container_name: vpush
    restart: unless-stopped
    user: "99:100"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      - TZ=Asia/Shanghai
      - CONFIG_PATH=/app/config.yaml
      - DB_PATH=/data/dav.db
      - FEISHU_APP_ID=${FEISHU_APP_ID}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET}
      - FEISHU_BOT_NAME=${FEISHU_BOT_NAME}
      - FEISHU_WEBHOOK_URL=${FEISHU_WEBHOOK_URL}
      - FEISHU_CREDENTIAL_KEY=${FEISHU_CREDENTIAL_KEY}
      - WECOM_WEBHOOK_URL=${WECOM_WEBHOOK_URL}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME}
      - TELEGRAM_RICH_MESSAGES=${TELEGRAM_RICH_MESSAGES:-true}
      - WECHAT_APP_ID=${WECHAT_APP_ID}
      - WECHAT_APP_SECRET=${WECHAT_APP_SECRET}
      - XUEQIU_COOKIE=${XUEQIU_COOKIE}
      - WEIBO_COOKIE=${WEIBO_COOKIE}
      - WEIBO_TOKEN=${WEIBO_TOKEN}
      - WEIBO_USERNAME=${WEIBO_USERNAME}
      - WEIBO_PASSWORD=${WEIBO_PASSWORD}
      # 知识星球：web token + App 通道（模拟安卓客户端，默认关）
      - ZSXQ_COOKIE=${ZSXQ_COOKIE}
      - ZSXQ_APP_CHANNEL=${ZSXQ_APP_CHANNEL:-0}
      - ZSXQ_APP_DEVICE=${ZSXQ_APP_DEVICE}
      - ZSXQ_WS_ENABLED=${ZSXQ_WS_ENABLED:-0}
      - ZSXQ_WS_ADDRESS=${ZSXQ_WS_ADDRESS}
      # X 登录 Cookie（完整串）：直抓 X 官方接口 + 官方翻译，免 API key
      - TWITTER_COOKIE=${TWITTER_COOKIE}
      - WEB_ALLOW_REGISTER=${WEB_ALLOW_REGISTER:-true}
      - WEB_TRUST_PROXY=${WEB_TRUST_PROXY:-true}
      - WEB_ADMIN_PASSWORD=${WEB_ADMIN_PASSWORD}
      - WEB_TOKEN_SECRET=${WEB_TOKEN_SECRET}
      - POLLING_POSTS_RETENTION_DAYS=${POLLING_POSTS_RETENTION_DAYS:-30}
      - POLLING_PUSH_LOGS_RETENTION_DAYS=${POLLING_PUSH_LOGS_RETENTION_DAYS:-90}
      - POLLING_DIGEST_INTERVAL_SECONDS=${POLLING_DIGEST_INTERVAL_SECONDS:-600}
      - POLLING_SOURCE_PROBE_INTERVAL_SECONDS=${POLLING_SOURCE_PROBE_INTERVAL_SECONDS:-600}
      - POLLING_COOKIE_KEEPALIVE_INTERVAL_SECONDS=${POLLING_COOKIE_KEEPALIVE_INTERVAL_SECONDS:-21600}
      - POLLING_DAILY_REPORT_HOUR=${POLLING_DAILY_REPORT_HOUR:-20}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FILE=${LOG_FILE:-/data/logs/app.log}
      - WAF_COOKIE_FILE=/data/waf_cookies.json
      - XUEQIU_SEED_COOKIE_FILE=/data/xueqiu_seed_cookie.txt
    volumes:
      - ./data:/data
    expose:
      - "8000"
    networks: [dav]

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: dav-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - vpush
    networks: [dav]

  # 轻量 JS solver 定期通过目标站点的 WAF 挑战（雪球 acw 挑战等），
  # 把验证通过的 cookie 写到共享数据卷，主容器抓取时读取复用。
  waf-bot:
    build: ./waf-bot
    container_name: vpush-waf-bot
    restart: unless-stopped
    user: "99:100"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      - TZ=Asia/Shanghai
      - WAF_COOKIE_FILE=/data/waf_cookies.json
      - WAF_REFRESH_INTERVAL=600
      - XUEQIU_SEED_COOKIE_FILE=/data/xueqiu_seed_cookie.txt
      # 雪球登录 cookie（可选）：注入后导出的是登录会话整套，组合等需登录接口可用
      - WAF_SEED_COOKIE=${XUEQIU_COOKIE}
    volumes:
      - ./data:/data
    networks: [dav]

volumes:
  caddy_data:
  caddy_config:

networks:
  dav:
