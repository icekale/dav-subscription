services:
  dav-subscription:
    build:
      context: .
      # 国内网络用清华镜像加速，海外环境可移除或改为官方源
      args:
        PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    container_name: dav-subscription
    network_mode: bridge
    ports:
      # 宿主机 8000 常被其他服务占用，Unraid 部署用 18084 对外
      - "18084:8000"
    environment:
      TZ: Asia/Shanghai
      CONFIG_PATH: /app/config.yaml
      DB_PATH: /data/dav.db
      # 密钥走环境变量（Unraid compose 里直接填，或放同目录 .env）
      FEISHU_APP_ID: "${FEISHU_APP_ID}"
      FEISHU_APP_SECRET: "${FEISHU_APP_SECRET}"
      FEISHU_BOT_NAME: "${FEISHU_BOT_NAME}"
      FEISHU_WEBHOOK_URL: "${FEISHU_WEBHOOK_URL}"
      WECOM_WEBHOOK_URL: "${WECOM_WEBHOOK_URL}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID}"
      TELEGRAM_PROXY: "${TELEGRAM_PROXY}"
      TELEGRAM_BOT_USERNAME: "${TELEGRAM_BOT_USERNAME}"
      WECHAT_APP_ID: "${WECHAT_APP_ID}"
      WECHAT_APP_SECRET: "${WECHAT_APP_SECRET}"
      XUEQIU_COOKIE: "${XUEQIU_COOKIE}"
      WEIBO_COOKIE: "${WEIBO_COOKIE}"
      WEIBO_TOKEN: "${WEIBO_TOKEN}"
      WEIBO_USERNAME: "${WEIBO_USERNAME}"
      WEIBO_PASSWORD: "${WEIBO_PASSWORD}"
      RSSHUB_BASE: "${RSSHUB_BASE:-https://rsshub.app}"
      XAI_API_KEY: "${XAI_API_KEY}"
      XAI_MODEL: "${XAI_MODEL:-grok-2-latest}"
      # X 登录 Cookie（完整串）：主通道直抓 X 官方接口 + 官方翻译，免 API key
      TWITTER_COOKIE: "${TWITTER_COOKIE}"
      WEB_ALLOW_REGISTER: "${WEB_ALLOW_REGISTER:-true}"
      WEB_ADMIN_PASSWORD: "${WEB_ADMIN_PASSWORD}"
      WEB_TOKEN_SECRET: "${WEB_TOKEN_SECRET}"
      POLLING_POSTS_RETENTION_DAYS: "30"
      POLLING_PUSH_LOGS_RETENTION_DAYS: "90"
      POLLING_DIGEST_INTERVAL_SECONDS: "${POLLING_DIGEST_INTERVAL_SECONDS:-600}"
      POLLING_SOURCE_PROBE_INTERVAL_SECONDS: "600"
      POLLING_COOKIE_KEEPALIVE_INTERVAL_SECONDS: "21600"
      POLLING_DAILY_REPORT_HOUR: "20"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      LOG_FILE: "${LOG_FILE:-}"
    volumes:
      - /mnt/user/appdata/dav-subscription/data:/data
      # 如需用配置文件（轮询间隔等），把 config.yaml 放到 appdata 目录再启用：
      # - /mnt/user/appdata/dav-subscription/config.yaml:/app/config.yaml:ro
    restart: unless-stopped
