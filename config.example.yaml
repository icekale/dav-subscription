notifiers:
  feishu:
    webhook_url: ""   # 飞书群机器人 webhook：群设置 → 群机器人 → 自定义机器人
    bot_name: ""      # 可选：飞书应用机器人名称，用于推送设置页的引导文案
  telegram:
    bot_token: ""     # @BotFather 创建 bot 获取
    chat_id: ""       # 接收推送的会话 ID（可用 @userinfobot 查询）
    proxy: ""         # 可选：Telegram 被墙时填 http://<host>:<port> 代理（支持认证）
    bot_username: ""  # 可选：机器人 @username，用于推送设置页的引导链接
    rich_messages: true  # false 时全部退回 sendMessage + HTML（应急回滚）
  wecom:
    webhook_url: ""   # 可选：企业微信群机器人 webhook（系统级告警用，用户可在网页自行绑定各自的群机器人）
  bark:
    bark_server: ""   # 可选：Bark 服务器地址，默认官方 https://api.day.app；自建实例时填 https://bark.example.com
    bark_key: ""      # 可选：系统级默认 Bark key（配置后系统告警也会发 Bark）
  webpush:
    vapid_private_key: ""  # 可选：Web Push VAPID 私钥 PEM；留空则首次使用时自动生成并写入数据库
    vapid_public_key: ""
    vapid_mailto: ""       # 可选：VAPID mailto，默认 mailto:admin@localhost

# 可选 LLM 摘要：配置 api_key 后，每日精选摘要/免打扰汇总会用 AI 生成要点；未配置则用普通列表汇总。
# OpenAI 兼容接口（/chat/completions，原生格式），可对接 OpenAI / DeepSeek（api_base 填 https://api.deepseek.com，model 填 deepseek-chat）/ 本地 Ollama、vLLM 等
# 也可让用户在网页「推送设置 → AI 摘要」里自配；用户自配优先于这里的全局配置
llm:
  api_base: "https://api.openai.com/v1"
  api_key: ""
  model: "gpt-4o-mini"

sources:
  ima:
    cookie: ''          # 网页 x-ima-cookie（列表/摘要）
    openapi_clientid: ''  # OpenAPI 凭证（取全文）
    openapi_apikey: ''    # 登录 https://ima.qq.com/agent-interface 生成
  xueqiu:
    cookie: ""        # 可选：浏览器登录雪球后复制 Cookie，推荐配置
  weibo:
    cookie: ""        # 推荐：浏览器登录 weibo.cn 后复制 Cookie
    token: ""         # 可选：x-xsrf-token
    username: ""      # 可选：微博账号（配置后自动登录续期 cookie）
    password: ""      # 可选：微博密码

polling:
  interval_seconds: 180
  jitter_seconds: 30
  notify_on_start: true
  posts_retention_days: 30
  push_logs_retention_days: 90
  digest_interval_seconds: 600   # 普通大V合并推送周期；0 = 关闭合并（实时推）
  source_probe_interval_seconds: 600  # 雪球 cookie 主动探测周期；0 = 关闭
  cookie_keepalive_interval_seconds: 21600  # 雪球/微博 cookie 保活周期；0 = 关闭
  daily_report_hour: 20   # 每日精选推送小时（0-23），用户需在推送设置里开启

web:
  allow_register: true   # 是否允许注册（关闭后注册入口不可用）；注册始终需要邀请码
  admin_password: ""     # 启动时创建 admin 管理员账号（推荐设置，部署后可在后台管理用户）
  token_secret: ""       # 可选：登录令牌签名密钥，不设置则自动生成并持久化到数据库
