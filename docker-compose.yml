services:
  vpush:
    build: .
    container_name: vpush
    restart: unless-stopped
    user: "99:100"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=64m,mode=1777
    ports:
      - "8000:8000"
    environment:
      - TZ=Asia/Shanghai
      - CONFIG_PATH=/app/config.yaml
      - DB_PATH=/data/dav.db
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./data:/data
